# TLS is required: the dashboard sends a bearer token with every request.
#
# 1. In the http { } context (e.g. /etc/nginx/conf.d/dash-limit.conf), once:
#      limit_req_zone $binary_remote_addr zone=dash:10m rate=30r/m;
#
# 2. Inside the existing :443 server { } block (the one with the Kite callback location):
#
# Then open  https://<your-host>/dash/   (the trailing slash matters: the page calls
# its API with a relative URL).
location = /dash {
    return 301 /dash/;
}
location /dash/ {
    limit_req zone=dash burst=20 nodelay;
    proxy_pass http://127.0.0.1:8765/;   # trailing slash strips the /dash prefix
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
    access_log off;                      # keep request lines out of the logs
}
