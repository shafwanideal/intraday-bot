# Add inside an existing HTTPS `server { ... }` block (the same one that fronts the Kite
# login callback), or a new server block with its own certificate. TLS is required: the
# dashboard sends a bearer token with every request.
#
# Then open  https://<your-host>/dash/   (the trailing slash matters: the page calls
# its API with a relative URL).
location = /dash {
    return 301 /dash/;
}
location /dash/ {
    proxy_pass http://127.0.0.1:8765/;   # trailing slash strips the /dash prefix
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
}
