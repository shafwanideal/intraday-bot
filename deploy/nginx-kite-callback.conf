# Put this INSIDE the existing `server { listen 443 ssl; server_name <your-domain>; ... }`
# block for the domain you dedicate to the Kite login callback (certbot creates that block).
# It forwards ONLY the callback and its health check to kite_login.py, which listens on
# 127.0.0.1:5099 -- everything else on this domain keeps returning nginx's normal 404.
#
# Note the regex covers BOTH paths: an exact `location = /zerodha_callback` alone would
# leave /zerodha_callback_health unproxied, so the health check could never say "ok".
location ~ ^/zerodha_callback(_health)?$ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:5099;
    proxy_read_timeout 15s;
}
